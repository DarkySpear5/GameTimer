appId: com.darkyspear5.gametimer2
productName: Game Timer (Beta)
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - resources/**
win:
  target: nsis
  icon: build/icon.ico
  artifactName: GameTimer-Setup-${version}.exe
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
publish:
  provider: github
  owner: DarkySpear5
  repo: GameTimer
  releaseType: prerelease
