appId: com.darkyspear5.gametimer2
productName: Gamut
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - resources/**
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/tray-idle.png
    to: tray-idle.png
  - from: build/tray-running.png
    to: tray-running.png
win:
  target: nsis
  icon: build/icon.ico
  artifactName: Gamut-Setup-${version}.exe
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
publish:
  provider: github
  owner: DarkySpear5
  repo: Gamut
  releaseType: release
